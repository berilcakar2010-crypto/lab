name: Android APK

# Her push'ta APK derlenir:
#  - "Actions" sekmesinde indirilebilir artifact olarak,
#  - ve "son-surum" adlı ön sürüm (pre-release) olarak — telefondan doğrudan indirilebilir.
# "v1.2.0" gibi bir etiket push'lanınca kalıcı bir sürüm (release) yayınlanır.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.LAB_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # GitHub'ın Ubuntu çalıştırıcılarında Android SDK hazır gelir (ANDROID_HOME, lisanslar kabul edilmiş);
      # eksik platform/build-tools sürümlerini Gradle kendisi indirir.
      - name: Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && test -d "$ANDROID_HOME"

      - name: Bağımlılıklar
        run: npm ci

      - name: Testler
        run: npm test

      - name: Web derlemesi
        run: npm run build

      - name: Capacitor senkronizasyonu
        run: npx cap sync android

      # İsteğe bağlı: depo sırlarında (Settings → Secrets → Actions) LAB_KEYSTORE_BASE64,
      # LAB_KEYSTORE_PASSWORD, LAB_KEY_ALIAS, LAB_KEY_PASSWORD tanımlıysa APK özel anahtarla imzalanır.
      # Tanımlı değilse depodaki sabit anahtar kullanılır; güncellemeler yine eski sürümün üzerine kurulur.
      - name: İmza anahtarı (varsa)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.LAB_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lab-release.keystore"
          echo "LAB_KEYSTORE_FILE=$RUNNER_TEMP/lab-release.keystore" >> "$GITHUB_ENV"

      - name: APK derle
        working-directory: android
        env:
          LAB_VERSION_CODE: ${{ github.run_number }}
          LAB_VERSION_NAME: 1.0.${{ github.run_number }}
          LAB_KEYSTORE_PASSWORD: ${{ secrets.LAB_KEYSTORE_PASSWORD }}
          LAB_KEY_ALIAS: ${{ secrets.LAB_KEY_ALIAS }}
          LAB_KEY_PASSWORD: ${{ secrets.LAB_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: APK'yı adlandır
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "Lab-1.0.${{ github.run_number }}.apk"
          ls -la *.apk

      - uses: actions/upload-artifact@v5
        with:
          name: Lab-APK-1.0.${{ github.run_number }}
          path: Lab-*.apk
          if-no-files-found: error

      - name: "Ön sürüm: son-surum"
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete son-surum --cleanup-tag --yes || true
          gh release create son-surum Lab-*.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Lab — son derleme (1.0.${{ github.run_number }})" \
            --notes "Dal: ${GITHUB_REF_NAME} · Commit: ${GITHUB_SHA::7}. Telefondan bu sayfayı açıp APK dosyasına dokun, sonra 'Bilinmeyen kaynaklardan yükleme' iznini ver. Yeni sürüm eskisinin üzerine kurulur; verilerin silinmez."

      - name: Kalıcı sürüm (etiket)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" Lab-*.apk --title "Lab $GITHUB_REF_NAME" --generate-notes
